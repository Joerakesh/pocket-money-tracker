name: Next.js and ML validation
on:
  push:
    branches: [main, migration/nextjs-app, feat/tailwind]
  pull_request:
    branches: [main, feat/tailwind]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - name: Install ML service dependencies
        run: python -m pip install -r ml-service/requirements.txt
      - name: Compile Python service
        run: python -m compileall -q ml-service/app
      - name: Test forecasting service
        working-directory: ml-service
        run: python -m unittest discover -s tests -v
