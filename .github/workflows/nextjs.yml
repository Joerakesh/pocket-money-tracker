name: Pocket web validation

on:
  push:
    branches: [main, migration/nextjs-app, feat/tailwind, feat/pocket-sync-android]
  pull_request:
    branches: [main, feat/tailwind]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm install reconciles the existing lockfile with package.json before validation.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
