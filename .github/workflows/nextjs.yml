name: Next.js validation
on:
  push:
    branches: [main, migration/nextjs-app, feat/tailwind]
  pull_request:
    branches: [main, feat/tailwind]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
